# Builds the signed MechGarage-android.apk. Called by every Release, or run on its own from Actions > Android > Run
# workflow to get a signed test build.
#
# Signing: Android only installs an update over an older copy if both were signed with the same key.
# GitHub makes the key on the first release and keeps it in this repository's Actions cache (keep-android-key.yml
# touches it every few days so GitHub never clears it). That's safe on this public repo only while
# Settings > Actions > General > "Require approval for all external contributors" is on, so strangers' pull
# requests can't run builds that read the cache. If these repository secrets exist, they're used instead:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS, ANDROID_KEYSTORE_PASSWORD  (tools/New-AndroidKey.ps1 makes them)
name: Android

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: dotnet workload install android

      - name: Keep the signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/android-key
          key: mechgarage-android-signing-key-v2

      - name: Set up signing
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/android-key
          if [ -n "$KEY_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/secret.keystore"
            KS="$RUNNER_TEMP/secret.keystore"; ALIAS="$KEY_ALIAS"; PASS="$KEY_PASS"
            echo "Using the signing key from the repository secrets."
          else
            KS=~/android-key/release.keystore; ALIAS="mechgarage"
            if [ ! -f "$KS" ]; then
              # first release: make the permanent key, with a random password kept next to it in the cache
              head -c 24 /dev/urandom | base64 | tr -d '/+=' > ~/android-key/password.txt
              PASS=$(cat ~/android-key/password.txt)
              keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=Mech Garage" > /dev/null
              echo "::notice::Made Mech Garage's signing key. GitHub keeps it in the Actions cache."
            else
              PASS=$(cat ~/android-key/password.txt)
              echo "Using the cached signing key."
            fi
          fi
          echo "::add-mask::$PASS"
          { echo "MG_KEYSTORE=$KS"; echo "MG_KEY_ALIAS=$ALIAS"; echo "MG_KEY_PASS=$PASS"; } >> "$GITHUB_ENV"

      - name: Build the release .apk
        run: |
          dotnet publish src/MechGarage.Android -c Release -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -o out/android

      - name: Sign it
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls out/android/*-Signed.apk | head -1)
          "$BT/apksigner" sign --ks "$MG_KEYSTORE" --ks-key-alias "$MG_KEY_ALIAS" \
            --ks-pass env:MG_KEY_PASS --key-pass env:MG_KEY_PASS --out MechGarage-android.apk "$APK"
          "$BT/apksigner" verify --print-certs MechGarage-android.apk | head -5
          ls -la MechGarage-android.apk
          rm -f "$RUNNER_TEMP/secret.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MechGarage-android.apk
