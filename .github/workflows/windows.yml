# Builds MechGarage.exe (self-contained) with the game's web folder, zipped as MechGarage-windows.zip. Called by every
# Release, or run on its own from Actions > Windows > Run workflow.
#
# Signing is optional, like SauceStore: with the WINDOWS_PFX_BASE64 (your family certificate's .pfx, base64-encoded) and
# WINDOWS_PFX_PASSWORD secrets, MechGarage.exe is signed and timestamped; without them it's unsigned.
name: Windows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build MechGarage.exe
        run: dotnet publish src/MechGarage.Windows -c Release -r win-x64 --self-contained -p:DebugType=none -o artifacts/windows
      - name: Sign it, if a certificate is set up
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host 'No WINDOWS_PFX_BASE64 secret: MechGarage.exe stays unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 artifacts\windows\MechGarage.exe
            if ($LASTEXITCODE) { throw 'signtool failed.' }
          } finally { Remove-Item $pfx -Force }
      - name: Zip it
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows/* -DestinationPath MechGarage-windows.zip
          Get-Item MechGarage-windows.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: MechGarage-windows.zip
